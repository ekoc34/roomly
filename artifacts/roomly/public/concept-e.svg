<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!--
    CONCEPT E — THE ADDRESS PIN
    A classic map location pin — but the pin head contains a tiny house silhouette.
    Below the pin's tip, a question-mark shadow on the ground whispers: "Which one is yours?"
    Answer: this one. You're already here.
  -->

  <!-- Map pin shape (teardrop: circle top + pointed bottom, rose-500) -->
  <path d="M100,170 Q72,144 46,80 A56,56 0 0 1 154,80 Q128,144 100,170 Z" fill="#f43f5e"/>

  <!-- White house silhouette inside pin head -->
  <!-- Roof triangle -->
  <path d="M100 36 L130 62 L70 62 Z" fill="white"/>
  <!-- House body -->
  <rect x="72" y="62" width="56" height="36" fill="white"/>
  <!-- Door (rose-500) — punches back through, grounding the house visual -->
  <rect x="88" y="76" width="24" height="22" rx="4" fill="#f43f5e"/>

  <!-- Question mark shadow on the ground beneath the pin tip -->
  <!-- Elliptical shadow base -->
  <ellipse cx="100" cy="185" rx="28" ry="7" fill="#1e293b" opacity="0.12"/>
  <!-- Question arc -->
  <path d="M91,180 Q89,170 100,168 Q111,166 111,175 Q111,181 104,183 L104,185"
        fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round" opacity="0.32"/>
  <!-- Question dot -->
  <circle cx="104" cy="188" r="2.5" fill="#1e293b" opacity="0.32"/>
</svg>
