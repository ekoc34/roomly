<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!--
    CONCEPT C — THE WELCOMING ARMS
    Two thick arms reach up and inward, their fingertips touching at the top.
    The negative space between them forms a perfect house pentagon.
    Welcome home — literally held in open arms.
  -->

  <!-- Left arm: horizontal hand at bottom, vertical forearm, curves to meet peak -->
  <path d="M16,164 L46,164 L46,90 Q46,40 100,40"
        fill="none" stroke="#f43f5e" stroke-width="24"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right arm (mirror): hand reaches in from the right -->
  <path d="M184,164 L154,164 L154,90 Q154,40 100,40"
        fill="none" stroke="#f43f5e" stroke-width="24"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
