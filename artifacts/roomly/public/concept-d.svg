<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!--
    CONCEPT D — THE DOORWAY ARROW
    A bold arch frames a doorway. The arch's crown is a W shape — the brand initial
    built into the architecture. Inside the white doorway, a bold upward arrow says:
    step through, move up, move forward.
  -->

  <!-- Outer arch — the W-crowned frame (rose-500 filled) -->
  <path d="
    M22,190 L22,108
    Q22,14 72,14
    Q90,14 100,38
    Q110,14 128,14
    Q178,14 178,108
    L178,190 Z
  " fill="#f43f5e"/>

  <!-- Inner arch cutout — the open doorway (white) -->
  <path d="
    M56,190 L56,110
    Q56,50 100,50
    Q144,50 144,110
    L144,190 Z
  " fill="white"/>

  <!-- Arrow pointing upward inside the doorway (rose — the call to action) -->
  <!-- Shaft -->
  <line x1="100" y1="174" x2="100" y2="105"
        stroke="#f43f5e" stroke-width="11" stroke-linecap="round"/>
  <!-- Arrowhead -->
  <path d="M78,128 L100,100 L122,128"
        fill="none" stroke="#f43f5e" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
