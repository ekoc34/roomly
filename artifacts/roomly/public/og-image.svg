<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f43f5e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e11d48;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle top highlight -->
  <rect width="1200" height="315" fill="url(#glow)" />

  <!-- Decorative large circle (background element) -->
  <circle cx="980" cy="100" r="320" fill="#ffffff" fill-opacity="0.05" />
  <circle cx="220" cy="530" r="260" fill="#ffffff" fill-opacity="0.05" />

  <!-- House icon (centered, slightly above middle) -->
  <g transform="translate(600, 185)" opacity="0.22">
    <!-- Roof -->
    <polygon points="0,-72 90,0 -90,0" fill="none" stroke="#ffffff" stroke-width="7" stroke-linejoin="round" />
    <!-- Walls -->
    <rect x="-62" y="0" width="124" height="88" rx="4" fill="none" stroke="#ffffff" stroke-width="7" />
    <!-- Door -->
    <rect x="-20" y="42" width="40" height="46" rx="4" fill="none" stroke="#ffffff" stroke-width="6" />
    <!-- Left window -->
    <rect x="-52" y="14" width="26" height="22" rx="3" fill="none" stroke="#ffffff" stroke-width="5" />
    <!-- Right window -->
    <rect x="26" y="14" width="26" height="22" rx="3" fill="none" stroke="#ffffff" stroke-width="5" />
  </g>

  <!-- Main brand name -->
  <text
    x="600"
    y="340"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif"
    font-size="112"
    font-weight="700"
    fill="#ffffff"
    text-anchor="middle"
    letter-spacing="-3"
  >Welkthuis<tspan font-weight="400" fill="#ffffff" fill-opacity="0.6">.nl</tspan></text>

  <!-- Subtitle -->
  <text
    x="600"
    y="415"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif"
    font-size="34"
    font-weight="400"
    fill="#ffffff"
    fill-opacity="0.82"
    text-anchor="middle"
    letter-spacing="0.5"
  >Vind je thuis in Nederland</text>

  <!-- Bottom tagline dots -->
  <g transform="translate(600, 500)" fill="#ffffff" fill-opacity="0.5">
    <circle cx="-140" cy="0" r="4" />
    <text x="-122" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" fill-opacity="0.55">Kamers</text>
    <circle cx="-18" cy="0" r="4" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" fill-opacity="0.55">Appartementen</text>
    <circle cx="160" cy="0" r="4" />
    <text x="178" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#ffffff" fill-opacity="0.55">Kortverblijf</text>
  </g>
</svg>
