<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!--
    CONCEPT B — THE FINGERPRINT HOUSE
    A fingerprint's concentric oval rings converge to a center that isn't an oval —
    it's a house pentagon. Every home is as unique as the person searching for it.
  -->

  <!-- Fingerprint rings — four concentric ovals -->
  <ellipse cx="100" cy="108" rx="88" ry="84" fill="none" stroke="#f43f5e" stroke-width="3.5"/>
  <ellipse cx="100" cy="108" rx="70" ry="66" fill="none" stroke="#f43f5e" stroke-width="3.5"/>
  <ellipse cx="100" cy="108" rx="52" ry="48" fill="none" stroke="#f43f5e" stroke-width="3.5"/>
  <ellipse cx="100" cy="108" rx="34" ry="30" fill="none" stroke="#f43f5e" stroke-width="3.5"/>

  <!-- White fill mask — erases oval lines inside the house shape -->
  <path d="M100,72 L130,98 L130,132 L70,132 L70,98 Z" fill="white"/>

  <!-- House pentagon — the innermost "ring" is now a house shape -->
  <path d="M100,72 L130,98 L130,132 L70,132 L70,98 Z"
        fill="none" stroke="#f43f5e" stroke-width="4.5"/>

  <!-- Door cutout inside house (rose-500 rectangle as a door, proving it's a home) -->
  <rect x="88" y="116" width="24" height="16" rx="3" fill="#f43f5e"/>
</svg>
